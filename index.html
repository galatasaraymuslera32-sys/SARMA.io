
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarma Hanım 😂</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

.container {
    background: white;
    padding: 35px;
    border-radius: 25px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 10px 30px #0003;
}

h1 { color: #e91e63; }

button {
    border: none;
    padding: 14px 30px;
    margin: 10px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

#evet { background: #4caf50; color: white; }
#hayir { background: #f44336; color: white; }

#sonuc { display: none; }

img {
    width: 100%;
    max-width: 350px;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 5px 15px #0003;
}
</style>
</head>

<body>

<div class="container">

    <div id="soru">
        <h1>SARMA HANIM 😂</h1>
        <h2>AYAK SEVİYOR MUSUNUZ?</h2>

        <button id="evet" onclick="evet()">EVET ❤️</button>
        <button id="hayir" onclick="hayir()">HAYIR ❌</button>
    </div>

    <div id="sonuc">
        <h1 id="mesaj"></h1>

        <!-- BURADA BORDO OJELİ AYAK FOTOĞRAFI -->
        <img src="indir.jpg" alt="Bordo ojeli ayak fotoğrafı">

        <h2>😂😂😂</h2>

        <button onclick="location.reload()">
            TEKRAR OYNA 🔄
        </button>
    </div>

</div>

<script>

let sayac = 0;

function evet() {
    document.getElementById("mesaj").innerText =
        "TEBRİKLER SARMA HANIM! 😂❤️";

    bitir();
}

function hayir() {
    sayac++;

    if (sayac === 1) {
        alert("EMİN MİSİNİZ? 🤨");
    }

    else if (sayac === 2) {
        alert("SON KEZ SORUYORUM, EMİN MİSİNİZ? 😂");
    }

    else {
        document.getElementById("mesaj").innerText =
            "HAYIR DEMEKLE OLMUYOR SARMA HANIM 😂❤️";

        bitir();
    }
}

function bitir() {
    document.getElementById("soru").style.display = "none";
    document.getElementById("sonuc").style.display = "block";
}

</script>

</body>
</html>
